name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install nightly toolchain
        run: rustup install nightly

      - name: Add rustfmt for nightly
        run: rustup component add rustfmt --toolchain nightly

      - name: Check
        run: cargo +nightly fmt --all --check -- --config format_code_in_doc_comments=true

  check:
    name: Check
    runs-on: ubuntu-latest
    env:
      # Keep the builds within the hosted runner's disk limit.
      # Debug symbols and incremental artifacts are not needed for CI checks.
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2.9.2

      - name: Check
        run: cargo check

      - name: Clippy
        run: cargo clippy -- -D warnings

      - name: Test
        run: cargo test

cargo-deny:
  name: Cargo deny
  runs-on: ubuntu-latest
  env:
    CARGO_DENY_VERSION: 0.20.2
  steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Install Rust
      run: rustup update stable && rustup default stable

    - uses: actions/cache@v6
      with:
        path: ${{ runner.tool_cache }}/cargo-deny
        key: cargo-deny-bin-${{ env.CARGO_DENY_VERSION }}

    - name: Add the tool cache directory to the search path
      run: echo "${{ runner.tool_cache }}/cargo-deny/bin" >> $GITHUB_PATH

    - name: Ensure that the tool cache is populated with the cargo-deny binary
      run: cargo +stable install --root ${{ runner.tool_cache }}/cargo-deny --version ${{ env.CARGO_DENY_VERSION }} cargo-deny

    - name: Check advisories
      run: cargo deny check advisories

    - name: Check licenses
      run: cargo deny check licenses
