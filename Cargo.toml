[package]
name = "redknife"
version = "0.2.0"
edition = "2024"
description = "A Swiss Army knife for offensive security."
authors = ["Yuki Kishimoto <yukikishimoto@protonmail.com>"]
homepage = "https://github.com/yukibtc/redknife"
repository = "https://github.com/yukibtc/redknife.git"
license = "MIT"
readme = "README.md"
rust-version = "1.88.0"
keywords = ["security", "pentesting", "red-team", "cli", "tui"]
categories = ["command-line-utilities", "network-programming"]

[[bin]]
name = "rk"
path = "src/main.rs"

[dependencies]
async-compression = { version = "0.4.50", default-features = false, features = ["tokio", "gzip", "zlib", "deflate", "brotli", "zstd"] }
bytes = "1.12.1"
chrono = "0.4.45"
clap = { version =  "4.6.7", features = ["derive"] }
crossterm = "0.29.0"
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
http = "1.5.0"
http-body-util = "0.1.5"
httparse = "1.10.1"
hyper = { version = "1.12.0", default-features = false, features = ["server", "client", "http1"] }
hyper-util = { version = "0.1.21", default-features = false, features = ["tokio"] }
indexmap = "2.14.2"
ratatui = "0.30.2"
ratatui-textarea = "0.9.3"
rustls-native-certs = "0.8"
sha1 = "0.11.0"
thiserror = "2.0.21"
tokio = { version = "1.53.2", default-features = false, features = ["fs", "io-std", "io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tokio-util = { version = "0.7.20", default-features = false, features = ["codec", "io"] }

[dev-dependencies]
tempfile = "3.27.0"
