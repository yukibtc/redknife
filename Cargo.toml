[package]
name = "redknife"
version = "0.1.0"
edition = "2024"
description = "A Swiss Army knife for offensive pentesting."
authors = ["Yuki Kishimoto <yukikishimoto@protonmail.com>"]
homepage = "https://github.com/yukibtc/redknife"
repository = "https://github.com/yukibtc/redknife.git"
license = "MIT"
readme = "README.md"
rust-version = "1.85.0"
keywords = ["security", "pentesting", "red-team", "cli", "tui"]
categories = ["command-line-utilities", "network-programming"]

[[bin]]
name = "rk"
path = "src/main.rs"

[dependencies]
async-trait = "0.1.92"
axum = "0.8.9"
bytes = "1.12.1"
chrono = "0.4.45"
clap = { version =  "4.6.7", features = ["derive"] }
crossterm = "0.28"
http = "1.5.0"
http-body-util = "0.1.5"
httparse = "1.10.1"
hyper = { version = "1.12.0", features = ["server", "client", "http1"] }
hyper-util = { version = "0.1.21", features = ["tokio", "client-legacy", "http1"] }
ratatui = "0.29"
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["io-util", "macros", "net", "rt-multi-thread", "signal"] }
tui-textarea = "0.7"

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.53.2", features = ["time"] }
