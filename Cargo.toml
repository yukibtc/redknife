[package]
name = "redknife"
version = "0.1.0"
edition = "2024"
description = "A Swiss Army knife for offensive pentesting."
authors = ["Yuki Kishimoto <yukikishimoto@protonmail.com>"]
homepage = "https://github.com/yukibtc/redknife"
repository = "https://github.com/yukibtc/redknife.git"
license = "MIT"
readme = "README.md"
rust-version = "1.85.0"
keywords = ["security", "pentesting", "red-team", "cli", "tui"]
categories = ["command-line-utilities", "network-programming"]

# TODO: rename the binary to a shorter name, like rk?

[dependencies]
axum = "0.8.9"
chrono = "0.4.45"
clap = { version =  "4.6.7", features = ["derive"] }
http = "1.5.0"
tokio = { version = "1.53.2", features = ["macros", "net", "rt-multi-thread", "signal"] }
